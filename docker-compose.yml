# Server Space Manager — Portainer-compatible stack.
#
# Designed for Portainer's "Git stack" deployment: Portainer clones the repo
# and runs `docker compose up -d` on the configured agent. Environment
# variables come from the Portainer stack UI (or a local .env file) and are
# interpolated using the standard ${VAR} syntax.
#
# The stack expects an already-existing external network where your vLLM
# container lives (default name: ai-network). Override via VLLM_NETWORK.

services:

  # ----------------------------------------------------------------------
  # The manager itself.
  #
  # - Builds from the cloned repo by default. Override SSM_IMAGE in the
  #   stack env once you publish a pre-built image to a registry.
  # - Mounts the host root read-only at /host so the scanner can sum
  #   filesystem and log/volume sizes without any write capability.
  # - Mounts the Docker socket read-only so it can list containers,
  #   volumes, and images. The Go HTTP client only ever issues GET
  #   requests against the Engine API. If you want a hard guarantee at
  #   the kernel/policy level, put a socket-proxy in front and switch
  #   docker.host in the config to its TCP endpoint.
  # ----------------------------------------------------------------------
  ssm:
    image: ${SSM_IMAGE:-server-space-manager-ai:local}
    build:
      context: .
      args:
        VERSION: ${SSM_VERSION:-dev}
    container_name: ssm
    restart: unless-stopped
    environment:
      SSM_CONFIG: /etc/ssm/config.yaml
      SSM_DB: /var/lib/ssm/ssm.db
      # Secrets and per-environment values come from .env (or Portainer
      # stack env). The Go config loader overlays these on top of the
      # config.yaml baked into the image, so credentials never need to
      # live in a file on disk.
      SSM_HTTP_PASSWORD: ${SSM_HTTP_PASSWORD:-}
      SSM_LLM_BASE_URL: ${LLM_BASE_URL:-}
      SSM_LLM_MODEL: ${LLM_MODEL:-}
      SSM_LLM_API_KEY: ${LLM_API_KEY:-}
      SSM_TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      SSM_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SSM_TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ssm-data:/var/lib/ssm
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${SSM_PORT:-8080}:8080"
    networks:
      - ai-network
    security_opt:
      - no-new-privileges:true
    # Cap our own log footprint. A space manager that itself fills the disk
    # would be embarrassing.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  ssm-data:

networks:
  # External network where your vLLM container lives. Create it once on the
  # host with: `docker network create ai-network` (or rename to match).
  ai-network:
    name: ${VLLM_NETWORK:-ai-network}
    external: true
